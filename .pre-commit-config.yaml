repos:

-   repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
    -   id: black
        types: [python]
        args: ["--config", "pyproject.toml"]

-   repo: https://github.com/pycqa/isort
    rev: 9.0.0b1
    hooks:
    -   id: isort
        name: isort (python)
        args: ["--settings-path", "pyproject.toml"]
# Linter only (pyflakes, see [tool.ruff] in pyproject.toml); formatting stays with
# black and isort above. The whole tree is scanned rather than the staged files,
# because an edit in one file (a renamed or deleted name) can break another.
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
    -   id: ruff-check
        args: [.]
        pass_filenames: false
